name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mkdir -p tmp && mvn -B clean install
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
          TMPDIR: ${{ github.workspace }}/tmp
      - name: Assemble Maven repository artifact
        if: matrix.java == '25' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn -N -q help:evaluate -Dexpression=project.version -DforceStdout)
          group=$(mvn -N -q help:evaluate -Dexpression=project.groupId -DforceStdout)
          group_path=${group//.//}
          for module in unirest-java-parent unirest-java unirest-object-mappers-gson unirest-objectmapper-jackson unirest-mocks; do
            source_dir="$HOME/.m2/repository/$group_path/$module/$version"
            destination="tmp/artifact/repository/$group_path/$module/$version"
            mkdir -p "$destination"
            cp "$source_dir/$module-$version.pom" "$destination/"
            if [ "$module" != unirest-java-parent ]; then
              cp "$source_dir/$module-$version.jar" "$destination/"
            fi
          done
          cp LICENSE tmp/artifact/LICENSE
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
          TMPDIR: ${{ github.workspace }}/tmp
      - name: Upload Maven repository artifact
        if: matrix.java == '25' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: unirest-maven-repository
          path: tmp/artifact/
          if-no-files-found: error
          retention-days: 90

  cross-runtime:
    name: Build on Java 25, test on Java 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile with Java 25
        run: mkdir -p tmp && mvn -B verify -DskipTests && cp unirest/target/classes/kong/unirest/Unirest.class tmp/Unirest.class
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
          TMPDIR: ${{ github.workspace }}/tmp
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test on Java 8
        run: mvn -B verify && cmp tmp/Unirest.class unirest/target/classes/kong/unirest/Unirest.class
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
          TMPDIR: ${{ github.workspace }}/tmp
