name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mkdir -p tmp && mvn -B verify
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ github.workspace }}/tmp
          TMPDIR: ${{ github.workspace }}/tmp
